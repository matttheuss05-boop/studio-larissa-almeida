    <!-- Script com IntersectionObserver para animações de Scroll Reveal fluido -->
    <script>
      (function initScrollReveal() {
        const elements = document.querySelectorAll('.scroll-reveal');
        if (!elements.length) return;

        if (!('IntersectionObserver' in window)) {
          elements.forEach(function (el) {
            el.classList.remove('opacity-0', 'translate-y-4');
            el.classList.add('opacity-100', 'translate-y-0');
          });
          return;
        }

        const observer = new IntersectionObserver(
          function (entries, observerInstance) {
            entries.forEach(function (entry) {
              if (entry.isIntersecting) {
                entry.target.classList.remove('opacity-0', 'translate-y-4');
                entry.target.classList.add('opacity-100', 'translate-y-0');
                observerInstance.unobserve(entry.target);
              }
            });
          },
          {
            root: null,
            rootMargin: '0px 0px -30px 0px',
            threshold: 0.1
          }
        );

        elements.forEach(function (el) {
          observer.observe(el);
        });
      })();
    </script>

    <!-- Script para forçar scroll para o topo (Hero) sempre que a página carregar -->
    <script>
      if ('scrollRestoration' in history) {
        history.scrollRestoration = 'manual';
      }
      window.scrollTo(0, 0);

      // Se houver hash na URL de navegações anteriores, remove para evitar salto no recarregamento
      if (window.location.hash) {
        if ('history' in window && 'replaceState' in history) {
          history.replaceState(null, '', window.location.pathname + window.location.search);
        }
      }

      window.addEventListener('load', function () {
        window.scrollTo(0, 0);
      });

      // Rolagem suave para seções internas sem fixar o hash na URL
      document.querySelectorAll('a[href^="#"]').forEach(function (anchor) {
        anchor.addEventListener('click', function (e) {
          const targetId = this.getAttribute('href');
          if (targetId && targetId !== '#') {
            const targetEl = document.querySelector(targetId);
            if (targetEl) {
              e.preventDefault();
              targetEl.scrollIntoView({ behavior: 'smooth' });
            }
          }
        });
      });
    </script>
